name: Release

# A v* tag builds wp-sites-hq.zip and its SHA-256 and puts both on a DRAFT release.
# Nothing is public until someone publishes the draft; the updater and the app ignore drafts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches the plugin version
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -Eq "^ \* Version: +${v//./\\.}$" wp-sites-hq.php || { echo "::error::wp-sites-hq.php Version is not $v"; exit 1; }
          grep -Eq "^Stable tag: ${v//./\\.}$" readme.txt || { echo "::error::readme.txt Stable tag is not $v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - run: npm ci
      # Plugin Check runs on the wp.org build: it fails any plugin that updates itself, which the GitHub build does.
      - name: Build without the updater, for Plugin Check
        run: bin/build-zip.sh --wporg
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/wp-sites-hq
      - name: Build the zip and its SHA-256
        run: npm run plugin-zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/wp-sites-hq.zip dist/wp-sites-hq.zip.sha256 \
            --draft --verify-tag --title "Monks Central ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
